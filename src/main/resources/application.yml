server:
  port: ${PORT:8086}

spring:
  application:
    name: cursos-service
  main:
    # los logs salen en JSON (ver logback-spring.xml) y el letrero de Spring no lo es: romperia la regla de que cada
    # linea de la salida es un evento que el almacen de logs puede leer
    banner-mode: "off"
  datasource:
    url: jdbc:postgresql://localhost:5437/cursos
    username: growlink
    # la contrasena NO va escrita aqui: viene de SPRING_DATASOURCE_PASSWORD (Azure, Docker y la demo la ponen). Para correr contra el
    # Postgres del docker-compose de este repo: SPRING_DATASOURCE_PASSWORD=growlink mvn spring-boot:run. Las pruebas usan H2 (application-test.yml)
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

# INTERRUPTOR del proveedor de identidad (ver SecurityConfig):
#   legacy (por defecto): el JWT compartido con auth-service / usuarios-service. Nada de lo actual cambia.
#   oidc: el token lo emite y firma el proveedor de identidad (Microsoft Entra ID) y aqui solo se valida.
# Para pasar a oidc no hay que tocar codigo: AUTH_MODE=oidc y las dos variables del emisor y la audiencia.
auth:
  mode: ${AUTH_MODE:legacy}
  # MULTI-INQUILINO. La app esta registrada en Entra para cuentas de cualquier directorio organizacional y
  # cuentas personales de Microsoft, asi que el `iss` del token trae el inquilino de QUIEN inicia sesion y no uno
  # fijo. Con false (por defecto) se compara el emisor contra AUTH_ISSUER_URI, como siempre. Con true se acepta
  # cualquier emisor que encaje ENTERO en el patron de un inquilino de Entra
  # (https://login.microsoftonline.com/<guid>/v2.0) y se exige que el claim `tid` sea ese mismo GUID; con eso se
  # caen http://, otros hosts y los parecidos tipo login.microsoftonline.com.evil.com.
  # Ver ValidadorDeEmisorMultiTenant.
  multi-tenant: ${AUTH_MULTI_TENANT:false}
  oidc:
    # obligatorio solo con multi-tenant: false
    issuer-uri: ${AUTH_ISSUER_URI:}
    # una o varias separadas por comas: Entra pone en `aud` el api://<client-id> o el <client-id> pelado segun
    # como este configurada la aplicacion, asi que lo normal es poner las dos formas
    audience: ${AUTH_AUDIENCE:}
    # opcional, solo en multi-inquilino: GUIDs de inquilino separados por comas. Vacia = cualquier inquilino de
    # Entra (que es lo que quiere una app multi-inquilino de verdad)
    allowed-tenants: ${AUTH_ALLOWED_TENANTS:}
    # opcional: donde estan las llaves publicas. En multi-inquilino, por defecto las de /common (no se pueden
    # descubrir desde el emisor, porque hay uno por inquilino); con un solo inquilino, se descubren a partir del
    # emisor al arrancar. AUTH_JWK_SET_URI se sigue aceptando como nombre viejo de la misma variable
    jwk-set-uri: ${AUTH_JWKS_URI:${AUTH_JWK_SET_URI:}}
    # claims donde puede venir el id numerico de usuario de GrowLink, en orden (el sub de Entra ID es un texto
    # opaco, no un numero), y de donde salen los roles
    claims-usuario: ${AUTH_CLAIMS_USUARIO:growlink_uid,uid,sub}
    claims-roles: ${AUTH_CLAIMS_ROLES:roles,rol,groups}
  # DE DONDE SALE LA IDENTIDAD DE GROWLINK (usuarioId numerico + rol). El token de Entra no la trae: su `sub` es
  # un texto opaco, no el numero con el que estan hechas las tablas de este servicio, y el rol es cosa de
  # GrowLink, no de Microsoft.
  #   usuarios-service (por defecto): se le pregunta a usuarios-service, que es su dueno
  #     (GET /api/usuarios/me reenviando el mismo token). Ver ClienteDeUsuariosService.
  #   claims: se lee del propio token. Se conserva para desarrollo y pruebas sin usuarios-service levantado; en
  #     produccion no se quiere, porque ahi el rol lo diria el propio token.
  # Cualquier otro valor no deja arrancar. En modo legacy esto no se usa para nada.
  identity-source: ${AUTH_IDENTITY_SOURCE:usuarios-service}
  usuarios-service:
    # obligatoria con identity-source=usuarios-service (si falta, el servicio no arranca)
    url: ${USUARIOS_SERVICE_URL:}
  # cuanto se guarda una identidad ya resuelta, para no consultar a usuarios-service en CADA peticion. Es el
  # retraso con el que este servicio se entera de un cambio de rol, asi que corto. Una entrada nunca vive mas que
  # el `exp` de su token
  identity-cache-seconds: ${AUTH_IDENTITY_CACHE_SECONDS:60}
  # tope de identidades guardadas a la vez, para que una lluvia de tokens distintos no haga crecer la memoria
  identity-cache-max: ${AUTH_IDENTITY_CACHE_MAX:10000}

# Solo lo lee TokenService, que solo existe en modo legacy: se sigue exigiendo (si falta, el servicio no arranca
# en legacy, que es lo que se quiere), pero en modo oidc nadie lo pide y no hace falta configurarlo.
jwt:
  secret: ${GROWLINK_JWT_SECRET}

# confidencialidad (S3, ver CifradoFilter): el cuerpo de las peticiones y respuestas va cifrado ademas de HTTPS.
#   clave-privada: llave RSA de 2048 bits en PKCS#8 (base64). Debe ser la misma en todas las instancias
#                  (y en los tres servicios, para que el front use una sola). Sin ella se crea una temporal.
#   obligatorio:   true = lo que llegue sin cifrar se rechaza con 400 (salvo salud, metricas y llamadas internas)
growlink:
  cifrado:
    clave-privada: ${GROWLINK_CIFRADO_CLAVE_PRIVADA:}
    obligatorio: ${GROWLINK_CIFRADO_OBLIGATORIO:false}

# La integracion real con la API de Claude (ClaudeRoadmapAiClient) solo se
# activa si la variable de entorno CLAUDE_API_KEY esta configurada; mientras
# tanto RoadmapService usa el modo de respaldo (ver README).

# ATRIBUTO: disponibilidad. La salud se expone sin detalles (no filtra nombres de bases ni versiones) y con sus
# dos sondas: liveness (el proceso vive) y readiness (puede atender: incluye la base de datos).
# ATRIBUTO: observabilidad. Las metricas (/actuator/metrics) las ve solo un ADMIN, y las mismas en el formato de
# Prometheus (/actuator/prometheus) solo con el token del scrape (ver SecurityConfig y TokenDeMetricas). Los tableros
# de Grafana estan en el repo infra.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Spring Boot NO mete la base en readiness por su cuenta: sin esto, una replica sin base seguia diciendo que
        # estaba lista y el balanceador le seguia mandando trafico. Liveness, en cambio, no la mira a proposito:
        # reiniciar la replica no arregla la base (ver ReadinessConLaBaseDeDatosTest)
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      # cubetas de latencia de las peticiones HTTP, para sacar el p95 por replica en el tablero. Son pocas y fijas
      # (no el histograma completo de Micrometer) para no multiplicar las series por cada ruta y cada replica
      slo:
        http.server.requests: 10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s

observabilidad:
  # nombre de esta replica para la etiqueta comun "instancia" de las metricas (ver MetricsConfig). En Azure App
  # Service WEBSITE_INSTANCE_ID ya viene puesta; si esta vacia se usa el nombre del host
  instancia: ${WEBSITE_INSTANCE_ID:}
  # el token que tiene que traer Prometheus en la cabecera X-Metricas-Token. Vacio = /actuator/prometheus cerrado
  metricas-token: ${METRICAS_TOKEN:}

# ATRIBUTO: seguridad y costo. Cada persona puede pedir como maximo `generaciones` roadmaps en `ventana-minutos`
# (cada uno puede costar una llamada a la IA). Cada replica cuenta por su lado. generaciones: 0 lo apaga.
roadmap:
  limite:
    generaciones: ${ROADMAP_LIMITE_GENERACIONES:10}
    ventana-minutos: ${ROADMAP_LIMITE_VENTANA_MINUTOS:10}
  ia:
    # ATRIBUTO: disponibilidad (tolerancia a fallos). Cortacircuito delante de la IA, ver CortacircuitoDeLaIa:
    # tras `fallos` fallos seguidos (error, demora de mas de `demora-segundos`, o una respuesta que no sirve) se
    # deja de llamar a la IA durante `espera-segundos`, y al cumplirse ese tiempo pasa UNA peticion de prueba.
    # Mientras esta abierto, el roadmap lo arma el algoritmo de respaldo, que no sale a internet.
    cortacircuito:
      fallos: ${ROADMAP_IA_CORTACIRCUITO_FALLOS:3}
      espera-segundos: ${ROADMAP_IA_CORTACIRCUITO_ESPERA_SEGUNDOS:60}
      demora-segundos: ${ROADMAP_IA_CORTACIRCUITO_DEMORA_SEGUNDOS:10}

# ATRIBUTO: seguridad y disponibilidad. Tope de peticiones por IP (ver LimitePorIpFilter), para todos los
# endpoints y antes de la seguridad y de la base de datos. La IP real se lee del primer valor de X-Forwarded-For
# (delante hay un balanceador) y si no llega, de la del socket. Cada replica cuenta por su lado.
# maximo-por-minuto: 0 lo apaga.
seguridad:
  limite-ip:
    maximo-por-minuto: ${LIMITE_IP_MAXIMO_POR_MINUTO:300}
    ventana-segundos: ${LIMITE_IP_VENTANA_SEGUNDOS:60}

# ATRIBUTO: observabilidad. Los logs salen en JSON, con el id de la peticion (X-Request-Id) en el campo rid de cada
# linea (ver logback-spring.xml). El patron de abajo es el del perfil logs-texto, para leerlos a ojo en desarrollo:
# ahi el id sale como [rid=...].
logging:
  level:
    com.growlink.cursos: INFO
  pattern:
    level: "%5p [rid=%X{rid:-}]"
