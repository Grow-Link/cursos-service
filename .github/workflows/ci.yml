name: CI

# corre las pruebas cada vez que se sube algo a main, avance o final,
# y tambien en los pull requests hacia main
on:
  push:
    branches: [main, avance, final]
  pull_request:
    branches: [main]

jobs:
  build-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # las pruebas usan H2 con el perfil test, no necesitan Postgres
      - name: Compilar y correr pruebas
        run: mvn -B verify

      - name: Guardar el jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ github.event.repository.name }}
          path: target/*.jar
          if-no-files-found: error
