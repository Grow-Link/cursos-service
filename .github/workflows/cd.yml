name: CD

# despliega a Azure App Service cada vez que se sube algo a main (o a mano desde la pestana Actions)
# el ambiente de GitHub que usa es "actual" (main), y si el repo tiene mas ramas desplegables, cada una
# usa el ambiente con su nombre (Settings > Environments). Cada ambiente guarda su propia app de Azure.
#
# Mientras el ambiente no tenga configurada la variable AZURE_WEBAPP_NAME, el despliegue se OMITE
# (con un aviso) y el workflow queda en verde: solo se prueba que compile y pasen las pruebas.
on:
  push:
    branches: [main, avance, final]
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'actual' || github.ref_name }}
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # no se despliega nada que no pase las pruebas
      - name: Compilar y correr pruebas
        run: mvn -B verify

      - name: Aviso, el despliegue a Azure no esta configurado
        if: ${{ vars.AZURE_WEBAPP_NAME == '' }}
        run: echo "::notice::Despliegue omitido, falta la variable AZURE_WEBAPP_NAME en el ambiente de GitHub (ver README de infra)."

      # AZURE_WEBAPP_NAME es una variable del ambiente
      # AZURE_WEBAPP_PUBLISH_PROFILE es un secreto del ambiente (se baja del portal de Azure)
      - name: Subir a Azure App Service
        if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: target/*.jar
