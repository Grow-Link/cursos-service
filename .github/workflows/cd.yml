name: CD

# despliega a Azure App Service cuando CI termina bien en main (o a mano desde la pestana Actions)
# el ambiente de GitHub que usa es "actual" (main), y si el repo tiene mas ramas desplegables, cada una
# usa el ambiente con su nombre (Settings > Environments). Cada ambiente guarda su propia app de Azure.
#
# Mientras el ambiente no tenga configurada la variable AZURE_WEBAPP_NAME, el despliegue se OMITE
# (con un aviso) y el workflow queda en verde: solo se prueba que compile y pasen las pruebas.
on:
  # Solo corre cuando CI termina y salio bien: un cambio que no compila, no pasa las pruebas o (con la variable
  # SONAR_ESPERAR_PUERTA=true) no pasa la puerta de calidad de SonarCloud no llega a Azure. A mano (workflow_dispatch)
  # se puede desplegar igual, para una emergencia. Escenario M1: el pipeline se detiene antes del despliegue.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, avance, final]
  workflow_dispatch:

jobs:
  desplegar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'actual' || (github.event.workflow_run.head_branch || github.ref_name) }}
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4
        with:
          # el commit que CI acaba de aprobar, no el ultimo de la rama
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # no se despliega nada que no pase las pruebas
      - name: Compilar y correr pruebas
        run: mvn -B verify

      - name: Aviso, el despliegue a Azure no esta configurado
        if: ${{ vars.AZURE_WEBAPP_NAME == '' }}
        run: echo "::notice::Despliegue omitido, falta la variable AZURE_WEBAPP_NAME en el ambiente de GitHub (ver README de infra)."

      # AZURE_WEBAPP_NAME es una variable del ambiente
      # AZURE_WEBAPP_PUBLISH_PROFILE es un secreto del ambiente (se baja del portal de Azure)
      - name: Subir a Azure App Service
        if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: target/*.jar
